name: Veroeffentlichen

on:
  push:
    branches:
      - claude/firmen-aufgaben-deploy-egkvb3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Logik-Tests
        run: node tests/board.test.mjs

      - name: Chromium bereitstellen
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Oberflaechentests
        run: node tests/e2e.test.mjs

  publish:
    name: Auf GitHub Pages veroeffentlichen
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seite auf den Zweig gh-pages schieben
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:gh-pages

      - name: Live-URL pruefen
        run: |
          set -uo pipefail
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          soll=$(sha256sum index.html | cut -d' ' -f1)
          echo "Pruefe $url gegen index.html ($soll)"
          for i in $(seq 1 24); do
            code=$(curl -s -o /tmp/live.html -w '%{http_code}' "$url" || echo 000)
            ist=$(sha256sum /tmp/live.html | cut -d' ' -f1)
            echo "Versuch $i: HTTP $code, ausgeliefert $ist"
            if [ "$code" = "200" ] && [ "$ist" = "$soll" ]; then
              css=$(curl -s -o /dev/null -w '%{http_code}' "${url}assets/style.css")
              font=$(curl -s -o /dev/null -w '%{http_code}' "${url}assets/fonts/sora-latin-800-normal.woff2")
              setup=$(curl -s -o /dev/null -w '%{http_code}' "${url}setup.html")
              echo "style.css $css, Sora $font, setup.html $setup"
              [ "$css$font$setup" = "200200200" ] || { echo "::error::Eine Datei fehlt."; exit 1; }
              echo "LIVE und aktuell: $url"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Unter $url wird nicht der aktuelle Stand ausgeliefert."
          exit 1
