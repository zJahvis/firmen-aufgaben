name: Veroeffentlichen

on:
  push:
    branches:
      - claude/firmen-aufgaben-deploy-egkvb3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Logik-Tests
        run: node tests/board.test.mjs

      - name: Chromium bereitstellen
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Oberflaechentests
        run: node tests/e2e.test.mjs

  publish:
    name: Auf GitHub Pages veroeffentlichen
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seite auf den Zweig gh-pages schieben
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:gh-pages

      - name: Live-URL pruefen
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "Pruefe $url"
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$url" || echo 000)
            echo "Versuch $i: HTTP $code"
            if [ "$code" = "200" ] && grep -q '<title>Firmen-Aufgaben</title>' /tmp/page.html; then
              echo "LIVE: $url"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Seite unter $url nicht erreichbar."
          exit 1
